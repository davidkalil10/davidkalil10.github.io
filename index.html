<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Kalil · Switch 2, Recompilações &amp; Flutter</title>
  <meta name="description" content="Portfólio e catálogo de projetos de David Kalil Braga (@davidkalil10): homebrew e ports para Nintendo Switch 2, recompilações multiplataforma e apps Flutter.">
  <meta name="theme-color" content="#1b1d21">
  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (() => {
      try {
        const t = localStorage.getItem('dk-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          const m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = t === 'light' ? '#f5f5f7' : '#1b1d21';
        }
      } catch {}
    })();
  </script>
</head>
<body>
  <!-- Inline SVG icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="ic-star" viewBox="0 0 16 16">
      <path fill="currentColor" d="M8 .6l2.22 4.5 4.97.72-3.6 3.51.85 4.95L8 11.94l-4.44 2.34.85-4.95-3.6-3.51 4.97-.72L8 .6z"/>
    </symbol>
    <symbol id="ic-download" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8 2.2v8.2m0 0l-3.2-3.2M8 10.4l3.2-3.2M2.5 13.3h11"/>
    </symbol>
    <symbol id="ic-external" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M6.2 3.2H3.4a1.2 1.2 0 0 0-1.2 1.2v8.2a1.2 1.2 0 0 0 1.2 1.2h8.2a1.2 1.2 0 0 0 1.2-1.2V9.8M9.4 2.2h4.4v4.4M13.6 2.4L7.2 8.8"/>
    </symbol>
    <symbol id="ic-search" viewBox="0 0 16 16">
      <circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M10.6 10.6L14 14"/>
    </symbol>
    <symbol id="ic-github" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.16c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.39-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
    </symbol>
    <symbol id="ic-kofi" viewBox="0 0 24 24">
      <path fill="currentColor" d="M18.6 6H4.2C3 6 2 7 2 8.2v6.6C2 17.7 4.3 20 7.2 20h6.4c2.8 0 5-2.2 5.2-5h.4c2.1 0 3.8-1.7 3.8-3.8V9.8C23 7.7 21.1 6 18.6 6zm-5.2 9.4c-1.8 1.4-2.9 2.2-2.9 2.2s-1.1-.8-2.9-2.2c-1.4-1.1-2-2.1-2-3.2 0-1.3 1-2.2 2.2-2.2.8 0 1.5.4 2.1 1.1l.6.7.6-.7c.6-.7 1.3-1.1 2.1-1.1 1.2 0 2.2.9 2.2 2.2 0 1.1-.6 2.1-2 3.2zm7.2-4.2c0 .9-.7 1.6-1.6 1.6h-.2V8.2h.2c.9 0 1.6.7 1.6 1.6v1.4z"/>
    </symbol>
    <symbol id="ic-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
      <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M12 2.5v2.3M12 19.2v2.3M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
    </symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M20.4 14.7A8.5 8.5 0 0 1 9.3 3.6a8.5 8.5 0 1 0 11.1 11.1z"/>
    </symbol>
    <symbol id="ic-switch" viewBox="0 0 20 20">
      <path fill="currentColor" d="M8.5 2.5H6.2A3.7 3.7 0 0 0 2.5 6.2v7.6a3.7 3.7 0 0 0 3.7 3.7h2.3a.8.8 0 0 0 .8-.8V3.3a.8.8 0 0 0-.8-.8zm-2.3 5a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8zM13.8 2.5h-2.3a.8.8 0 0 0-.8.8v13.4a.8.8 0 0 0 .8.8h2.3a3.7 3.7 0 0 0 3.7-3.7V6.2a3.7 3.7 0 0 0-3.7-3.7zm0 10.6a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8z"/>
    </symbol>
    <symbol id="ic-devices" viewBox="0 0 20 20">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M2.5 4.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zm3 11.5h5M14.5 8h3a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
    </symbol>
    <symbol id="ic-close" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3.5 3.5l9 9m0-9l-9 9"/>
    </symbol>
    <symbol id="ic-chevron" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 6l4 4 4-4"/>
    </symbol>
  </svg>

  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left">
        <a href="#top" class="brand" id="brand-home">
          <img src="assets/avatar.jpg" alt="David Kalil Braga" class="brand-avatar" width="38" height="38">
          <span class="brand-name">davidkalil10</span>
        </a>

        <span class="header-divider" aria-hidden="true"></span>

        <div class="header-stats" role="group" aria-label="Estatísticas do catálogo">
          <span class="stat-item"><strong id="stat-projects">20</strong> <span data-i18n="statProjects">projetos</span></span>
          <span class="stat-item"><strong id="stat-stars">0</strong> <span data-i18n="statStars">stars</span></span>
          <span class="stat-item"><strong id="stat-downloads">0</strong> <span data-i18n="statDownloads">downloads</span></span>
        </div>
      </div>

      <nav class="header-actions" aria-label="Ações e links sociais">
        <button type="button" id="lang-toggle" class="icon-btn lang-btn" aria-label="Switch language" title="Português / English">PT</button>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Alternar tema" title="Alternar tema">
          <svg class="ic ic-theme-sun" width="18" height="18"><use href="#ic-sun"/></svg>
          <svg class="ic ic-theme-moon" width="18" height="18"><use href="#ic-moon"/></svg>
        </button>
        <a href="https://github.com/davidkalil10" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="GitHub" title="GitHub">
          <svg width="18" height="18"><use href="#ic-github"/></svg>
        </a>
        <a href="https://ko-fi.com/davidkalil10" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="Ko-fi" title="Apoiar no Ko-fi">
          <svg width="18" height="18"><use href="#ic-kofi"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <section class="recent" aria-labelledby="recent-heading">
    <div class="container">
      <div class="section-head">
        <h2 id="recent-heading" class="section-title" data-i18n="latestUpdates">Últimas atualizações</h2>
      </div>
      <div id="recent-strip" class="recent-strip"></div>
    </div>
  </section>

  <main class="library" id="top">
    <div class="container">
      <div class="section-head library-head">
        <h2 class="section-title" data-i18n="projectsHeading">Projetos</h2>
      </div>
      <div class="toolbar">
        <div id="platform-tabs" class="platform-tabs" role="tablist" aria-label="Filtrar por plataforma"></div>
        <div id="category-pills" class="category-pills" role="group" aria-label="Filtrar por categoria"></div>

        <div class="search-sort-row">
          <label class="search-box" for="search-input">
            <svg width="15" height="15" aria-hidden="true"><use href="#ic-search"/></svg>
            <input type="search" id="search-input" autocomplete="off" spellcheck="false" placeholder="Buscar projetos…">
            <kbd class="search-kbd" aria-hidden="true">/</kbd>
          </label>

          <div class="sort-wrap">
            <select id="sort-select" aria-label="Ordenar projetos">
              <option value="updated">Mais recentes</option>
              <option value="stars">Mais estrelados</option>
              <option value="downloads">Mais baixados</option>
              <option value="name">Nome: A–Z</option>
            </select>
          </div>
        </div>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </div>

      <div id="catalog-groups" class="catalog-groups"></div>
    </div>
  </main>

  <dialog id="project-dialog" class="project-dialog" aria-labelledby="dialog-title">
    <div class="dialog-shell">
      <div class="dialog-top">
        <span id="dialog-category" class="dialog-category"></span>
        <button type="button" id="dialog-close" class="icon-btn dialog-close" aria-label="Fechar">
          <svg width="16" height="16"><use href="#ic-close"/></svg>
        </button>
      </div>

      <div class="dialog-hero">
        <img id="dialog-image" class="dialog-artwork" src="" alt="" width="112" height="112">
        <div class="dialog-intro">
          <h2 id="dialog-title" class="dialog-title"></h2>
          <div id="dialog-platforms" class="dialog-platforms"></div>
          <p id="dialog-summary" class="dialog-summary"></p>
        </div>
      </div>

      <div class="dialog-meta-strip">
        <div class="meta-cell">
          <span class="meta-label" data-i18n="metaVersion">Versão</span>
          <strong id="dialog-version" class="meta-val">—</strong>
        </div>
        <div class="meta-cell">
          <span class="meta-label" data-i18n="metaUpdated">Atualizado em</span>
          <strong id="dialog-date" class="meta-val">—</strong>
        </div>
        <div class="meta-cell">
          <span class="meta-label" data-i18n="metaStats">GitHub</span>
          <strong id="dialog-stars" class="meta-val">—</strong>
        </div>
      </div>

      <div id="dialog-note" class="dialog-note" hidden>
        <strong id="dialog-note-title" class="note-title"></strong>
        <p id="dialog-note-body" class="note-body"></p>
      </div>

      <div class="dialog-actions">
        <a id="dialog-primary-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer"></a>
        <a id="dialog-source-btn" class="btn btn-secondary" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15"><use href="#ic-github"/></svg>
          <span data-i18n="sourceCode">Código-fonte</span>
        </a>
        <a id="dialog-release-btn" class="btn btn-secondary" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg width="14" height="14"><use href="#ic-external"/></svg>
          <span data-i18n="allReleases">Releases</span>
        </a>
      </div>

      <div id="dialog-assets-wrap" class="dialog-assets" hidden>
        <span class="assets-heading" data-i18n="otherDownloads">Arquivos disponíveis</span>
        <div id="dialog-assets-list" class="assets-list"></div>
      </div>

      <details id="dialog-notes-wrap" class="dialog-notes" hidden>
        <summary class="notes-toggle">
          <span data-i18n="releaseNotes">Notas da versão</span>
          <svg width="14" height="14"><use href="#ic-chevron"/></svg>
        </summary>
        <p id="dialog-notes-body" class="notes-body"></p>
      </details>

      <div class="dialog-foot">
        <span id="dialog-repo-label" class="repo-attrib"></span>
      </div>
    </div>
  </dialog>

  <script src="assets/app.js" defer></script>
</body>
</html>
